repository:
  name: akamai-dev-box
  description: OpenTofu configuration for a personal Ubuntu dev box on Akamai Cloud for hosted coding agents
  topics:
    - akamai
    - linode
    - opentofu
    - terraform
    - infrastructure-as-code
    - devbox
    - ubuntu
    - coding-agents
    - claude-code
    - opencode
    - docker
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

labels:
  - name: dependencies
    color: "0366d6"
    description: Pull requests that update dependencies
  - name: ci
    color: "1d76db"
    description: Changes to CI workflows and automation
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
      required_status_checks:
        strict: true
        contexts:
          - OpenTofu fmt + validate
          - actionlint
          - Scan
      enforce_admins: false
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false
