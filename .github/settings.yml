repository:
  name: akamai-dev-box-arch
  description: OpenTofu configuration for an Arch Linux development box on Akamai Cloud
  topics:
    - akamai
    - linode
    - opentofu
    - terraform
    - arch-linux
    - infrastructure-as-code
    - devbox
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
      required_status_checks:
        strict: true
        contexts: []
      enforce_admins: false
      restrictions: null
